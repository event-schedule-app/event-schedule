<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>イベント予定表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#f2f5f4; --grid:#dbe8ee; --panel:#ffffff; --ink:#1b2247; --ink2:#525a7d; --rule:#8fbbd8;
  --warn:#c9302c; --focus:#2d78e0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11152b; --grid:#1c2645; --panel:#1a2040; --ink:#e9ecf8; --ink2:#a5add0; --rule:#3c5f8c;
    --warn:#ff6259; --focus:#6aa6ff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11152b; --grid:#1c2645; --panel:#1a2040; --ink:#e9ecf8; --ink2:#a5add0; --rule:#3c5f8c;
  --warn:#ff6259; --focus:#6aa6ff;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{
  margin:0;min-height:100%;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font:400 15px/1.65 'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Noto Sans JP',sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2.5px solid var(--ink);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px}
.top h1{flex:1;min-width:0;font:400 19px/1.3 'Dela Gothic One','Zen Kaku Gothic New',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{min-width:44px;min-height:44px;border:0;background:transparent;cursor:pointer;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-top:2.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:transparent;cursor:pointer;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;min-height:52px}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs [aria-current="page"]{background:var(--ink);color:var(--paper)}
main{max-width:680px;margin:0 auto;padding:16px 14px 170px}
.fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:19}

.btn{border:2.5px solid var(--ink);background:var(--panel);color:var(--ink);padding:8px 16px;min-height:44px;cursor:pointer;font-weight:700;box-shadow:3px 3px 0 var(--ink);border-radius:0}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.danger{color:var(--warn);border-color:var(--warn);box-shadow:3px 3px 0 var(--warn)}
.btn.sm{min-height:38px;padding:5px 12px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 4px}
.f{margin:0 0 18px}
.lab,.f>label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],input[type=date],input[type=search],select,textarea{
  width:100%;box-sizing:border-box;border:2px solid var(--ink);background:var(--panel);color:var(--ink);
  font:inherit;font-size:16px;padding:9px 10px;border-radius:0;min-height:44px}
textarea{min-height:180px;resize:vertical;line-height:25.5px;padding-top:6px;
  background-image:linear-gradient(transparent 24px,var(--grid) 24px);background-size:100% 25.5px;background-attachment:local}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--ink2);margin-top:6px}
.quick{display:flex;gap:8px;margin-top:6px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border:2.5px solid var(--ink);background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--focus);outline-offset:2px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 0;border:1.5px solid var(--ink);background:var(--panel);
  font-size:13px;font-weight:700;line-height:1.4;margin:0 6px 6px 0;border-radius:0;cursor:default}
button.chip{cursor:pointer}
.chip>i{width:6px;align-self:stretch;background:var(--c,var(--ink));display:block}
.chip.pick{opacity:.55;border-style:dashed;background:transparent}
.chip.pick.on{opacity:1;border-style:solid;background:var(--panel)}
.chip.pick.on b::before{content:'✓ '}
.chip.dim{opacity:.55}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.day{font:400 21px/1.2 'Dela Gothic One','Zen Kaku Gothic New',sans-serif;margin:28px 0 12px;display:flex;align-items:center;gap:12px}
.day::after{content:'';flex:1;height:9px;color:var(--ink);background-image:radial-gradient(currentColor 1.1px,transparent 1.7px);background-size:6px 6px}
.rail{margin-left:12px;padding-left:24px;border-left:3px dashed var(--rule)}
.gap{font-size:12.5px;font-weight:700;color:var(--ink2);margin:-2px 0 8px}
.panel{position:relative;margin:0 0 14px;background:var(--panel);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:0 0 10px;cursor:pointer}
.panel::before{content:'';position:absolute;left:-33px;top:13px;width:15px;height:15px;box-sizing:border-box;background:var(--paper);border:3px solid var(--ink);border-radius:50%}
.ph{display:flex;align-items:stretch;border-bottom:2.5px solid var(--ink)}
.ph time{background:var(--ink);color:var(--paper);font:400 15px/1 'Dela Gothic One',sans-serif;padding:0 11px;display:flex;align-items:center;white-space:nowrap}
.ph h3{flex:1;min-width:0;padding:7px 10px;font-size:16px;line-height:1.4}
.warnb{background:var(--warn);color:#fff;font-size:12px;font-weight:700;padding:0 8px;display:flex;align-items:center}
.pb{padding:10px 12px 0}
.place-tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.excerpt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;margin-top:4px;color:var(--ink2);font-size:14px}

.now{background:var(--panel);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);margin-bottom:6px}
.sl{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.sl input{flex:1;accent-color:var(--ink);height:32px}
.counters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}
.cn{background:var(--panel);border:2.5px solid var(--ink);padding:8px 2px 6px;text-align:center}
.cn b{display:block;font:400 28px/1.15 'Dela Gothic One',sans-serif}
.cn span{font-size:11.5px;font-weight:700;color:var(--ink2)}
.pl{background:var(--panel);border:2.5px solid var(--ink);margin-bottom:12px;padding:10px 12px 4px}
.pl h3{font-size:15px;margin-bottom:2px}
.pl .last{font-size:12.5px;color:var(--ink2);margin:0 0 8px}

.list{display:grid;gap:12px}
.card{display:grid;grid-template-columns:8px 1fr;column-gap:12px;text-align:left;width:100%;background:var(--panel);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 12px 10px 0;cursor:pointer}
.card .bar{grid-row:1/3;background:var(--c,var(--ink));margin:-10px 0}
.card .nm{font-weight:700;font-size:16px}
.card .sub{font-size:13px;color:var(--ink2)}
.empty{background:var(--panel);border:2.5px dashed var(--ink);padding:26px 18px;text-align:center}
.empty h2{font:400 20px/1.4 'Dela Gothic One',sans-serif;margin-bottom:8px}
.empty p{color:var(--ink2);margin-bottom:16px}
.empty .actions{justify-content:center}

.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(10,14,35,.6)}
.sheet-panel{position:relative;width:100%;max-width:680px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
  border:2.5px solid var(--ink);border-bottom:0;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;overscroll-behavior:contain}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;justify-content:space-between;margin:0 -16px 16px;padding:4px 4px 4px 16px;border-bottom:2.5px solid var(--ink)}
.sheet-head h2{font:400 16px/1.3 'Dela Gothic One',sans-serif}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.detail h2{font:400 22px/1.4 'Dela Gothic One',sans-serif;margin-bottom:6px}
.story{white-space:pre-wrap;background:var(--panel);border:2px solid var(--ink);padding:12px;margin:10px 0 16px;line-height:1.85}
.story.none{color:var(--ink2);border-style:dashed}
.warns{list-style:none;padding:0;margin:8px 0 0}
.warns li{padding:6px 10px;margin-bottom:6px;background:var(--panel);border-left:5px solid var(--warn);font-size:13.5px}
.warns li::before{content:'重複の可能性  ';font-weight:700;color:var(--warn)}
.hist{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--ink);padding:8px 10px;margin-bottom:8px;cursor:pointer}
.hist small{display:block;color:var(--ink2);font-size:12px}
.io{width:100%;min-height:150px;margin-top:10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;font-weight:700;z-index:120;max-width:88vw;text-align:center}
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.gate-box{max-width:420px;width:100%;background:var(--panel);border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:24px 20px;text-align:center}
.gate-box h2{font:400 24px/1.3 'Dela Gothic One',sans-serif;margin-bottom:10px}
.gate-box p{color:var(--ink2);margin-bottom:14px;overflow-wrap:anywhere}
.gate-box .actions{justify-content:center}
body.at-home .tabs{display:none}
.gate-box input{margin-bottom:10px}
.gate-box form{margin:0}
.or{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--ink2);margin:18px 0 12px!important}
.or::before,.or::after{content:'';flex:1;height:2px;background:var(--rule)}
.linkbtn{border:0;background:none;padding:6px 4px;min-height:36px;cursor:pointer;color:var(--focus);font-weight:700;font-size:13.5px;text-decoration:underline}
.gate-links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin:4px 0 0!important}
.err{color:var(--warn)!important;font-weight:700;font-size:13.5px;margin:8px 0 0!important}
.err:empty{display:none}
.wide{width:100%}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border:1.5px solid currentColor;padding:0 6px;margin-left:6px;color:var(--ink2);vertical-align:1px}
.acc .btn{flex:none}
.acc{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--ink);padding:4px 4px 4px 10px;margin-bottom:8px;overflow-wrap:anywhere}
.acc span{flex:1;min-width:0;font-size:14px}
.sync{font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width:700px){.fab{right:calc(50% - 326px)}}
</style>
</head>
<body>

<header class="top">
  <button class="ib" id="back" data-act="home" aria-label="プロジェクト一覧に戻る" hidden style="margin-left:-8px;font-size:28px">‹</button>
  <h1 id="ttl">イベント予定表</h1>
  <span class="sync" id="sync" aria-live="polite"></span>
  <button class="btn sm" id="shareBtn" data-act="share" hidden>共有</button>
  <button class="ib" data-act="menu" aria-label="メニューを開く">⋯</button>
</header>
<main id="view"></main>
<button class="btn pri fab" id="fab" data-act="new-scene">＋ 予定を追加</button>

<nav class="tabs" aria-label="表示切り替え">
  <button data-act="tab" data-tab="timeline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18M6 7h13M6 12h9M6 17h13"/></svg>予定表</button>
  <button data-act="tab" data-tab="snap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5"/><rect x="13.5" y="3" width="7.5" height="7.5"/><rect x="3" y="13.5" width="7.5" height="7.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5"/></svg>配置</button>
  <button data-act="tab" data-tab="people"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg>メンバー</button>
  <button data-act="tab" data-tab="places"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>場所</button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-back" data-act="close-sheet"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="ib" data-act="close-sheet" aria-label="閉じる">×</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="gate"><div class="gate-box"><h2>読み込み中</h2><p>少しお待ちください。</p></div></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signOut,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {terminate,clearIndexedDbPersistence,initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,writeBatch,setDoc,updateDoc,query,where,arrayUnion,arrayRemove} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ===== ここを自分の Firebase の値に書き換える ===== */
const firebaseConfig={
  apiKey:'AIzaSyCrrWbDIPuGTOjUtQeEBSo8swgl3DUvywg',
  authDomain:'event-schedule-d7fbd.firebaseapp.com',
  projectId:'event-schedule-d7fbd',
  storageBucket:'event-schedule-d7fbd.firebasestorage.app',
  messagingSenderId:'235738665614',
  appId:'1:235738665614:web:d9630158e43cf1627f6fdf'
};
/* ================================================== */

const KEY='place-timeline-v1';
const COLORS=['#2f5fd0','#d8472f','#1f9a8a','#c48a1a','#8a4fc2','#d0568f','#4f7f2a','#546178'];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
/* 安全対策:IDは英数字・_・- だけ、色は #rrggbb だけを受け付ける */
const okId=s=>typeof s==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(s);
const safeColor=c=>/^#[0-9a-fA-F]{6}$/.test(c||'')?c:'#546178';

function blank(){return {title:'名称未設定の予定表',chars:[],places:[],scenes:[]};}
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.scenes)&&Array.isArray(d.chars)&&Array.isArray(d.places))return d;}}catch(e){}return null;}
let S=blank();

/* ===== クラウド同期 =====
   プロジェクトを開いている間、S をそのまま編集して save() を呼ぶと、前回の同期内容との差分だけを書き込む */
const COLS=['chars','places','scenes'];
const base={chars:new Map(),places:new Map(),scenes:new Map(),title:null};
const loaded={chars:false,places:false,scenes:false};
let db=null,auth=null,user=null,projUnsubs=[],listUnsub=null,titleTimer=null;
let projects=[],projectsLoaded=false,cur=null;
const myEmail=()=>(user?.email||'').toLowerCase();
const isOwner=()=>!!cur&&!!user&&cur.data.owner===user.uid;
const EMAIL_RE=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
function stable(v){if(Array.isArray(v))return '['+v.map(stable).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v);}
function clean(o){return JSON.parse(JSON.stringify(o));}
function setSync(t){const el=$('#sync');if(el)el.textContent=t;}
function commitOps(ops){
  const chunks=[];for(let i=0;i<ops.length;i+=450)chunks.push(ops.slice(i,i+450));
  return chunks.reduce((p,ch)=>p.then(()=>{const b=writeBatch(db);ch.forEach(o=>{if(o.k==='set')b.set(o.r,o.v);else if(o.k==='upd')b.update(o.r,o.v);else b.delete(o.r);});return b.commit();}),Promise.resolve());
}
function save(){
  if(!db||!user||!cur)return;
  const pid=cur.id,ops=[],now=Date.now();
  ['chars','places'].forEach(col=>S[col].forEach((it,i)=>{if(typeof it.o!=='number')it.o=now+i;}));
  COLS.forEach(col=>{
    const seen=new Set();
    S[col].forEach(it=>{
      if(!it.id)return;seen.add(it.id);
      const js=stable(it);
      if(base[col].get(it.id)!==js){ops.push({k:'set',r:doc(db,'projects',pid,col,it.id),v:clean(it)});base[col].set(it.id,js);}
    });
    [...base[col].keys()].forEach(id=>{if(!seen.has(id)){ops.push({k:'del',r:doc(db,'projects',pid,col,id)});base[col].delete(id);}});
  });
  const name=(S.title||'').trim()||'無題のプロジェクト';
  if(name!==base.title){ops.push({k:'upd',r:doc(db,'projects',pid),v:{name}});base.title=name;}
  if(!ops.length)return;
  setSync('保存中…');
  commitOps(ops).then(()=>setSync('保存済み'))
    .catch(e=>{console.error(e);setSync('保存失敗');toast(e&&e.code==='permission-denied'?'このプロジェクトを編集する権限がありません':'保存できませんでした。通信状態を確認してください');});
}
function saveTitleSoon(){clearTimeout(titleTimer);titleTimer=setTimeout(save,700);}
let rrPending=false;
function remoteRender(){
  if(rrPending)return;rrPending=true;
  requestAnimationFrame(()=>{rrPending=false;
    if(cur&&!COLS.every(c=>loaded[c]))return;
    const ae=document.activeElement;
    if(cur&&ui.tab==='timeline'&&ae&&ae.id==='q'&&$('#tlList'))paintTl();
    else render();
    if(cur&&!$('#sheet').hidden&&ed)edWarn();
    if($('#sh-list'))paintShare();
  });
}

/* ----- プロジェクト一覧 ----- */
function listenProjects(){
  if(listUnsub)listUnsub();
  projectsLoaded=false;
  listUnsub=onSnapshot(query(collection(db,'projects'),where('emails','array-contains',myEmail())),snap=>{
    const arr=[];snap.forEach(d=>{const v=d.data();v.id=d.id;arr.push(v);});
    arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    projects=arr;projectsLoaded=true;
    if(cur){
      const p=arr.find(x=>x.id===cur.id);
      if(!p){if(!cur.fresh)kicked();}
      else{
        cur.fresh=false;cur.data=p;
        const name=p.name||'無題のプロジェクト';
        const ae=document.activeElement;
        if(base.title!==name&&!(ae&&ae.id==='m-title')){S.title=name;base.title=name;}
      }
    }
    remoteRender();

const ui={tab:'timeline',filterChar:'',q:'',snapIdx:null};
const ch=id=>S.chars.find(c=>c.id===id);
const pl=id=>S.places.find(p=>p.id===id);

/* 時間 */
const WD=['日','月','火','水','木','金','土'];
function todayStr(){const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;}
function dayNum(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return Math.round((m?Date.UTC(+m[1],+m[2]-1,+m[3]):Date.UTC(2026,0,1))/864e5);}
function dateStr(n){const d=new Date(n*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;}
function fmtDay(n){const d=new Date(n*864e5);return `${d.getUTCFullYear()}年${d.getUTCMonth()+1}月${d.getUTCDate()}日(${WD[d.getUTCDay()]})`;}
function ts(sc){const p=String(sc.time||'00:00').split(':');return dayNum(sc.date)*1440+(Number(p[0])||0)*60+(Number(p[1])||0);}
function fmtTs(t){const d=Math.floor(t/1440),r=t%1440;return `${fmtDay(d)} ${pad(Math.floor(r/60))}:${pad(Math.floor(r%60))}`;}
function migrate(){if(S.title==='名称未設定の記録帳')S.title='名称未設定の予定表';S.scenes.forEach(s=>{if(!s.date){s.date=dateStr(dayNum(todayStr())+(Number(s.day)||1)-1);delete s.day;}});}
function fmtClock(t){const r=t%1440;return `${pad(Math.floor(r/60))}:${pad(Math.floor(r%60))}`;}
function fmtDur(m){m=Math.max(0,Math.round(m));if(m<60)return `${m}分`;const d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;let s='';if(d)s+=`${d}日`;if(h)s+=`${h}時間`;if(mm&&!d)s+=`${mm}分`;return s||'0分';}
function sortedScenes(list){return (list||S.scenes).slice().sort((a,b)=>ts(a)-ts(b));}

/* メンバーの居場所:その時点までに最後に登場した予定 */
function placeAt(cid,sorted,n){let seen=false,place=null,sc=null;for(let i=0;i<n;i++){if((sorted[i].members||[]).includes(cid)){seen=true;place=sorted[i].placeId||null;sc=sorted[i];}}return {seen,place,sc};}

/* 矛盾チェック:同時刻に同じメンバーが別々の場所にいる */
function sceneWarnings(sc,list){
  const out=[],t=ts(sc);
  if(!sc.placeId)return out;
  list.forEach(o=>{
    if(o===sc||ts(o)!==t||!o.placeId||o.placeId===sc.placeId)return;
    (sc.members||[]).filter(m=>(o.members||[]).includes(m)).forEach(m=>{
      const c=ch(m);if(!c)return;
      out.push(`${c.name}が同じ時刻(${fmtTs(t)})に「${pl(sc.placeId)?.name||'?'}」と「${pl(o.placeId)?.name||'?'}」の両方に割り当てられています(ダブルブッキング)`);
    });
  });
  return out;
}

/* 年表 */
function renderTimeline(v){
  if(!S.scenes.length){
    v.innerHTML=emptyBlock('まだ予定がありません','メンバーと場所を登録して、「いつ・どこで・誰が・何をするか」を予定として入れていきます。','<button class="btn pri" data-act="new-scene">最初の予定を追加</button><button class="btn" data-act="sample">サンプルを見る</button>');
    return;
  }
  v.innerHTML=`<div class="filters"><input type="search" id="q" placeholder="キーワードで探す" aria-label="キーワードで探す" value="${esc(ui.q)}"><select id="fc" aria-label="メンバーで絞り込む"><option value="">全員の予定</option>${S.chars.map(c=>`<option value="${esc(c.id)}" ${ui.filterChar===c.id?'selected':''}>${esc(c.name)}が関わる予定</option>`).join('')}</select></div><div id="tlList"></div>`;
  paintTl();

function paintTl(){
  const sorted=sortedScenes(),q=ui.q.trim().toLowerCase(),fc=ui.filterChar,items=[];
  sorted.forEach(sc=>{
    if(fc&&!(sc.members||[]).includes(fc))return;
    if(q){const hay=[sc.title,sc.text,pl(sc.placeId)?.name,...(sc.members||[]).map(id=>ch(id)?.name)].join(' ').toLowerCase();if(!hay.includes(q))return;}
    items.push(sc);
  });
  const box=$('#tlList');
  if(!items.length){box.innerHTML='<p class="hint" style="margin-top:20px">条件に合う予定がありません。</p>';return;}
  let html='',curDay=null,prevT=null;
  items.forEach(sc=>{
    const T=ts(sc),d=Math.floor(T/1440);
    if(d!==curDay){if(curDay!==null)html+='</div>';html+=`<h2 class="day">${fmtDay(d)}</h2><div class="rail">`;curDay=d;}
    if(prevT!==null&&T>prevT)html+=`<div class="gap">＋${fmtDur(T-prevT)}</div>`;
    prevT=T;
    const chips=(sc.members||[]).map(id=>{const c=ch(id);return c?chip(c):'';}).join('');
    const wn=sceneWarnings(sc,sorted).length,p=pl(sc.placeId);
    html+=`<article class="panel" role="button" tabindex="0" data-act="open-scene" data-id="${esc(sc.id)}"><div class="ph"><time>${fmtClock(T)}</time><h3>${esc(sc.title||'(無題)')}</h3>${wn?`<span class="warnb">重複${wn}</span>`:''}</div><div class="pb">${p?`<span class="place-tag">場所:${esc(p.name)}</span><br>`:''}${chips}${sc.text?`<p class="excerpt">${esc(sc.text)}</p>`:''}</div></article>`;
  });
  if(curDay!==null)html+='</div>';
  box.innerHTML=html;
}

/* 配置 */
function renderSnap(v){
  const sorted=sortedScenes();
  if(!sorted.length){v.innerHTML=emptyBlock('予定がまだありません','予定を追加すると、スライダーで「この時点で誰がどこに配置されているか」を確認できます。','<button class="btn pri" data-act="new-scene">予定を追加</button><button class="btn" data-act="sample">サンプルを見る</button>');return;}
  if(ui.snapIdx==null||ui.snapIdx>sorted.length-1)ui.snapIdx=sorted.length-1;
  v.innerHTML=`<div class="sl"><button class="btn sm" data-act="snap-prev" aria-label="前の予定">◀</button><input type="range" id="snapRange" min="0" max="${sorted.length-1}" step="1" value="${ui.snapIdx}" aria-label="予定を選ぶ"><button class="btn sm" data-act="snap-next" aria-label="次の予定">▶</button></div><div id="snapBody"></div>`;
  paintSnap();
}
function paintSnap(){
  const sorted=sortedScenes(),idx=ui.snapIdx,sc=sorted[idx],T=ts(sc);
  const rows=S.chars.map(c=>({c,loc:placeAt(c.id,sorted,idx+1)}));
  const seen=rows.filter(r=>r.loc.seen),unseen=rows.filter(r=>!r.loc.seen);
  const groups=new Map();
  seen.forEach(r=>{const k=r.loc.place||'';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);});
  const lastAt=new Map();
  for(let i=0;i<=idx;i++){if(sorted[i].placeId)lastAt.set(sorted[i].placeId,sorted[i]);}
  const keys=S.places.map(p=>p.id).filter(id=>groups.has(id)||lastAt.has(id));
  if(groups.has(''))keys.push('');
  const blocks=keys.map(k=>{
    const p=k?pl(k):null,last=k?lastAt.get(k):null;

/* メニュー・入出力 */
function timelineText(){
  const sorted=sortedScenes();let out=`# ${S.title}\n`,day=null;
  sorted.forEach(sc=>{
    const t=ts(sc),d=Math.floor(t/1440),p=pl(sc.placeId);
    if(d!==day){out+=`\n■ ${fmtDay(d)}\n`;day=d;}
    out+=`\n[${fmtClock(t)}] ${sc.title||'(無題)'}${p?` @${p.name}`:''}\n`;
    const who=(sc.members||[]).map(id=>ch(id)?.name).filter(Boolean).join('、');
    if(who)out+=`  担当:${who}\n`;
    if(sc.text)out+=sc.text.split('\n').map(l=>'  '+l).join('\n')+'\n';
  });
  return out;
}

    const d=JSON.parse($('#io').value);

    d.chars=d.chars.filter(c=>c&&okId(c.id));d.places=d.places.filter(p=>p&&okId(p.id));d.scenes=d.scenes.filter(s=>s&&okId(s.id));
    d.scenes.forEach(s=>{s.members=Array.isArray(s.members)?s.members.filter(okId):[];if(s.placeId&&!okId(s.placeId))s.placeId='';});
    S={title:S.title,
      chars:d.chars.map(c=>({id:c.id,name:String(c.name||'').slice(0,100),color:safeColor(c.color),note:c.note||''})),
      places:d.places.map(p=>({id:p.id,name:p.name,note:p.note||''})),

  const nm=S.title||'無題のプロジェクト';document.title=nm;$('#ttl').textContent=nm;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===ui.tab?'page':'false'));
  const map={timeline:['＋ 予定を追加','new-scene'],snap:['＋ 予定を追加','new-scene'],people:['＋ メンバー','new-char'],places:['＋ 場所','new-place']};
  fab.textContent=map[ui.tab][0];fab.dataset.act=map[ui.tab][1];
  ({timeline:renderTimeline,snap:renderSnap,people:renderPeople,places:renderPlaces})[ui.tab]($('#view'));
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'tab':ui.tab=t.dataset.tab;render();window.scrollTo(0,0);break;
    case 'new-scene':openEditor();break;
    case 'new-char':openChar();break;
    case 'new-place':openPlace();break;
    case 'open-scene':openScene(id);break;
    case 'edit-scene':openEditor(id);break;
    case 'open-char':openChar(id);break;
    case 'open-place':openPlace(id);break;
    case 'close-sheet':closeSheet();break;
    case 'menu':openMenu();break;
    case 'sample':{if(S.scenes.length&&t.dataset.armed!=='1'){t.dataset.armed='1';t.textContent='もう一度押すと、今の予定を消してサンプルに置き換え';break;}loadSample();break;}
    case 'login-google':loginGoogle();break;
    case 'auth-toggle':authMode=authMode==='login'?'signup':'login';showLogin();break;
    case 'auth-reset':resetPass();break;
    case 'verify-check':verifyCheck();break;
    case 'verify-resend':sendEmailVerification(auth.currentUser).then(()=>toast('確認メールを再送しました')).catch(e=>toast(authMsg(e)));break;
    case 'logout':closeSheet();logout();break;
    case 'reload':location.reload();break;
    case 'm-local':{const d=loadLocal();if(!d)break;$('#m-io').innerHTML='';ioBox(JSON.stringify(d),false,{act:'m-doimport',label:'この内容で置き換える'});toast('内容を確認して「この内容で置き換える」を押してください');break;}
    case 'home':goHome();break;
    case 'proj-new':openNewProject();break;
    case 'proj-create':createProject();break;
    case 'proj-open':openProject(id);break;
    case 'share':openShare();break;
    case 'sh-add':shareAdd();break;
    case 'sh-del':{if(t.dataset.armed!=='1'){t.dataset.armed='1';t.textContent='もう一度押すと外す';break;}shareDel(t.dataset.email);break;}
    case 'proj-leave':{if(t.dataset.armed!=='1'){t.dataset.armed='1';t.textContent='もう一度押すと抜ける';break;}leaveProject();break;}
    case 'proj-del':{if(t.dataset.armed!=='1'){t.dataset.armed='1';t.textContent='もう一度押すと、全員の分を完全に削除';break;}deleteProject();break;}
    case 'snap-to':{ui.snapIdx=sortedScenes().findIndex(s=>s.id===id);ui.tab='snap';closeSheet();render();window.scrollTo(0,0);break;}
    case 'snap-prev':stepSnap(-1);break;
    case 'snap-next':stepSnap(1);break;
    case 'c-save':saveChar();break;
    case 'c-del':delChar();break;
    case 'c-color':cd.color=t.dataset.col;document.querySelectorAll('#c-colors .sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.col===cd.color));break;
    case 'p-save':savePlace();break;
    case 'p-del':delPlace();break;
    case 'ed-mem':{const d=ed.d,i=d.members.indexOf(id);if(i>=0)d.members.splice(i,1);else d.members.push(id);edMembers();edWarn();break;}
    case 'ed-addchar':{
      const inp=$('#e-newchar'),n=inp.value.trim();if(!n){toast('名前を入力してください');break;}
      const c={id:uid(),name:n,color:COLORS[S.chars.length%COLORS.length],note:''};
      S.chars.push(c);save();ed.d.members.push(c.id);inp.value='';edMembers();edWarn();break;}
    case 'ed-save':edSave();break;
    case 'ed-del':edDelete();break;
    case 'm-text':ioBox(timelineText(),true,{act:'m-copy',label:'コピーする'});break;
    case 'm-export':ioBox(JSON.stringify(S,null,1),true,{act:'m-copy',label:'コピーする'});break;
    case 'm-import':ioBox('',false,{act:'m-doimport',label:'この内容で置き換える'});break;
    case 'm-copy':copyIo();break;
    case 'm-doimport':importData();break;
    case 'm-clear':{if(!confirmDel){confirmDel=true;t.textContent='もう一度押すと全データを消去';break;}S={title:S.title,chars:[],places:[],scenes:[]};ui.snapIdx=null;save();closeSheet();render();toast('消去しました');break;}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;paintTl();}
  else if(t.id==='snapRange'){ui.snapIdx=+t.value;paintSnap();}
});
document.addEventListener('submit',e=>{if(e.target.id==='mailForm'){e.preventDefault();submitMail();}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='np-name'){e.preventDefault();createProject();}
  else if(e.target.id==='sh-email'){e.preventDefault();shareAdd();}
});
document.addEventListener('change',e=>{if(e.target.id==='fc'){ui.filterChar=e.target.value;paintTl();}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();}
});
$('#sheetBody').addEventListener('input',edInput);
$('#sheetBody').addEventListener('change',edInput);
boot();
</script>
</body>
</html>
